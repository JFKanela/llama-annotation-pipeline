# =====================================================================
# Configuration - Lama glama proteome annotation
#
# This file configures the AUTOMATED part of the project only:
#   Liftoff  (DNA-to-DNA lift-over)
#   miniprot (protein-to-genome alignment)
#   plus data acquisition and BUSCO / AGAT / gffcompare quality control.
#
# The LiftOn (hybrid homology) and Helixer (ab initio) branches are NOT
# configured here: they were run manually and on external GPU infrastructure
# respectively. See REPRODUCIBILITY.md, sections 3 and 4.
# =====================================================================

# --- Genomes (INSDC / RefSeq) --------------------------------------
# Target: Lama glama, chromosome-level DNA Zoo assembly (Hi-C)
target_accession: "GCA_028534125.1"
# Reference: Vicugna pacos, RefSeq (annotation RS_2025_04, April 2025)
reference_accession: "GCF_048564905.1"

# --- Baseline (optional) -------------------------------------------
# Previous chaku proteome (GCA_013239585.1). Leave "" to omit it.
# Place it under resources/ and write its name here.
baseline_proteome: "resources/Lama_glama_proteome_v1.fasta"

# --- QC ------------------------------------------------------------
busco_lineage: "artiodactyla_odb12"
# Secondary lineage, e.g. "cetartiodactyla_odb10", to bridge to the published
# alpaca figure; "" to omit it.
# Note: "cetartiodactyla_odb12" does NOT exist in OrthoDB v12, because the clade
# was renamed to Artiodactyla.
busco_lineage_secondary: ""
busco_offline: false                        # true if the lineage was already downloaded into busco_downloads/

# --- Resources -----------------------------------------------------
threads: 8

# --- Liftoff (DNA-to-DNA branch) -----------------------------------
liftoff_polish: true        # -polish: corrects indels/frameshifts. Recommended.
liftoff_copies: true        # -copies: searches for extra gene copies
liftoff_flank: 0.0          # -flank: fraction of flanking sequence to align

# --- miniprot (protein-to-genome branch) ---------------------------
miniprot_outn: 1            # alignments per protein in the final proteome (1 = best only)

# --- Proteomes -----------------------------------------------------
# Reduces the reference annotation to one transcript per gene (AGAT) before it
# is handed to Liftoff and miniprot, which makes the BUSCO duplication metric
# interpretable.
#
# IMPORTANT: this setting does NOT affect the LiftOn branch, which requires the
# native NCBI GFF3 and therefore starts from the full multi-isoform reference.
# The three homology branches consequently do not share the same reference
# annotation. See the "Reference asymmetry" section of README.md before
# comparing their completeness figures.
keep_longest_isoform: true
